name: Cross-Platform Build ROS2 CUDA Packages

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      package_repo:
        description: 'Git repository URL'
        required: true
        default: 'https://github.com/hku-mars/FAST_LIO.git'
      package_name:
        description: 'Package Name'
        required: true
        default: 'FAST_LIO'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fast-lio2

jobs:
  build-and-push:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_platform: "x86_64"
            arch: "linux/amd64"
            cuda_arch: "7.5;8.0;8.6;8.9"
            base_image: "ghcr.io/${{ github.repository_owner }}/ros2-cuda-base:x86_64"
            runner: "ubuntu-latest"
            build_type: "native"

          - target_platform: "orin-agx"
            arch: "linux/arm64"
            cuda_arch: "8.7"
            base_image: "ghcr.io/${{ github.repository_owner }}/ros2-cuda-base:orin"
            runner: "ubuntu-latest"
            build_type: "cross-qemu"

          - target_platform: "orin-nano"
            arch: "linux/arm64"
            cuda_arch: "8.7"
            base_image: "ghcr.io/${{ github.repository_owner }}/ros2-cuda-base:orin"
            runner: "ubuntu-latest"
            build_type: "cross-qemu"

          - target_platform: "orin-agx-native"
            arch: "linux/arm64"
            cuda_arch: "8.7"
            base_image: "ghcr.io/${{ github.repository_owner }}/ros2-cuda-base:orin"
            runner: ["self-hosted", "ARM64", "jetson"]
            build_type: "native"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-compilation)
        if: matrix.build_type == 'cross-qemu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.target_platform }}-latest
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/package/Dockerfile.template
          platforms: ${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            REPO_URL=${{ github.event.inputs.package_repo || 'https://github.com/hku-mars/FAST_LIO.git' }}
            REPO_BRANCH=ros2
            PACKAGE_NAME=${{ github.event.inputs.package_name || 'FAST_LIO' }}
            CUDA_ARCH=${{ matrix.cuda_arch }}
          cache-from: type=gha,scope=${{ matrix.target_platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target_platform }}

  test-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Test Docker Container Structure
        run: |
          echo "Testing x86_64 image startup..."
          docker run --rm ghcr.io/${{ github.repository_owner }}/fast-lio2:x86_64-latest ros2 pkg list | grep fast_lio